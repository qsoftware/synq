[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "synq"
version = "0.0.1"
description = "SynQ: quantum circuit synthesis (state preparation, unitaries, diagonal gates) in C++ with Python bindings"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.scikit-build]
cmake.version = ">=3.15"
wheel.packages = ["python/synq"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
SYNQ_BUILD_TESTS = "OFF"
SYNQ_BUILD_PYTHON = "ON"
